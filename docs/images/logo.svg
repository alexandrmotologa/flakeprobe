<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Watertight Base Silhouette: Origami Peregrine Falcon -->
      <path d="
        M 0 -280
        L 75 -230
        L 140 -160
        L 240 -80
        L 280 40
        L 210 160
        L 130 250
        L 0 310
        L -130 250
        L -210 160
        L -280 40
        L -240 -80
        L -140 -160
        L -75 -230
        Z
      " fill="#0b0f19" />

      <!-- Crown & Head Armor Plates -->
      <!-- Center Forehead Ridge -->
      <polygon points="0,-280 45,-210 0,-150 -45,-210" fill="#334155" />
      <polygon points="0,-280 0,-150 45,-210" fill="#475569" />
      <polygon points="0,-280 -45,-210 0,-150" fill="#1e293b" />

      <!-- Temporal Brow Left & Right -->
      <polygon points="45,-210 120,-175 60,-130 0,-150" fill="#1e293b" />
      <polygon points="-45,-210 0,-150 -60,-130 -120,-175" fill="#334155" />

      <!-- Apex Ears / Crest Flares -->
      <polygon points="45,-210 120,-175 75,-240" fill="#0f172a" />
      <polygon points="-45,-210 -75,-240 -120,-175" fill="#1e293b" />

      <!-- Sharp Predatory Almond Eyes (Electric Cyan) -->
      <!-- Right Eye -->
      <polygon points="25,-125 75,-140 90,-115 40,-105" fill="url(#cyan-glow)" />
      <polygon points="45,-128 70,-135 60,-115" fill="#ffffff" />
      <!-- Left Eye -->
      <polygon points="-25,-125 -40,-105 -90,-115 -75,-140" fill="url(#cyan-glow)" />
      <polygon points="-45,-128 -60,-115 -70,-135" fill="#ffffff" />

      <!-- Eye Socket Shading Facets -->
      <polygon points="25,-125 40,-105 15,-80 0,-110" fill="#0f172a" />
      <polygon points="-25,-125 0,-110 -15,-80 -40,-105" fill="#1e293b" />

      <!-- Beak Structure (Aerodynamic Vector) -->
      <polygon points="0,-110 24,-65 0,-30 -24,-65" fill="url(#amber-accent)" />
      <polygon points="0,-110 0,-30 24,-65" fill="#fbbf24" />
      <polygon points="0,-110 -24,-65 0,-30" fill="#d97706" />
      <polygon points="0,-30 14,-10 0,35 -14,-10" fill="#0f172a" />

      <!-- Cheek Malar Facets (Tear Stripes as Clean Polygons) -->
      <polygon points="40,-105 90,-115 130,-50 65,-50" fill="#0f172a" />
      <polygon points="-40,-105 -65,-50 -130,-50 -90,-115" fill="#1e293b" />

      <polygon points="65,-50 130,-50 110,30 40,0" fill="#1e293b" />
      <polygon points="-65,-50 -40,0 -110,30 -130,-50" fill="#334155" />

      <!-- Throat & Gorget Facets -->
      <polygon points="0,35 40,0 60,65 0,90" fill="#334155" />
      <polygon points="0,35 0,90 -60,65 -40,0" fill="#1e293b" />
      <polygon points="0,90 80,120 0,165 -80,120" fill="#0f172a" />
      <polygon points="0,90 0,165 80,120" fill="#1e293b" />
      <polygon points="0,90 -80,120 0,165" fill="#0b0f19" />

      <!-- Broad Folded Wings (DAG Vector Facets) -->
      <!-- Right Wing Facets -->
      <polygon points="120,-175 220,-110 160,-30 90,-115" fill="#334155" />
      <polygon points="220,-110 260,-20 180,40 160,-30" fill="#1e293b" />
      <polygon points="260,-20 280,60 210,130 180,40" fill="#0f172a" />
      <polygon points="180,40 210,130 140,210 110,110" fill="#334155" />
      <polygon points="110,110 140,210 60,265 80,160" fill="#1e293b" />
      <polygon points="60,265 0,310 0,220 80,160" fill="#0f172a" />

      <!-- Left Wing Facets -->
      <polygon points="-120,-175 -90,-115 -160,-30 -220,-110" fill="#475569" />
      <polygon points="-220,-110 -160,-30 -180,40 -260,-20" fill="#334155" />
      <polygon points="-260,-20 -180,40 -210,130 -280,60" fill="#1e293b" />
      <polygon points="-180,40 -110,110 -140,210 -210,130" fill="#475569" />
      <polygon points="-110,110 -80,160 -60,265 -140,210" fill="#334155" />
      <polygon points="-60,265 -80,160 0,220 0,310" fill="#1e293b" />

      <!-- Chest Decision Core (Cyan Vector Pulse) -->
      <polygon points="0,175 35,215 0,255 -35,215" fill="none" stroke="#00f5ff" stroke-width="4" />
      <circle cx="0" cy="215" r="8" fill="#00f5ff" />

    </g>
  </g>
</svg>
